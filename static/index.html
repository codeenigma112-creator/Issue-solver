<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue Solver</title>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--surface-2:#f8fafc;--line:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--primary:#2563eb;--primary-hover:#1d4ed8;
  --primary-soft:#eff6ff;--danger:#dc2626;--danger-soft:#fef2f2;--warning:#b45309;
  --warning-soft:#fffbeb;--radius:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
  --code:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
body[data-mode=maintainer]{--primary:#7c3aed;--primary-hover:#6d28d9;--primary-soft:#f5f3ff}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  gap:16px;height:64px;padding:0 24px;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
  background:var(--primary);color:#fff;font-size:12px;font-weight:800}
.header-right{display:flex;align-items:center;gap:14px;min-width:0}
.user-chip{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);font-size:13px}
.mode{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;
  cursor:pointer;user-select:none;white-space:nowrap}
.mode input{position:absolute;width:1px;height:1px;opacity:0}
.slider{position:relative;width:36px;height:20px;border-radius:999px;background:#cbd5e1;
  transition:background .18s ease;flex:0 0 auto}
.slider::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.25);transition:transform .18s ease}
.mode input:checked+.slider{background:var(--primary)}
.mode input:checked+.slider::after{transform:translateX(16px)}
.mode input:focus-visible+.slider{box-shadow:0 0 0 3px var(--primary-soft)}
main{max-width:1180px;margin:0 auto;padding:32px 24px 64px}
.page-heading{margin-bottom:22px}
.page-heading h1{margin:0 0 4px;font-size:24px;line-height:1.25;letter-spacing:-.02em}
.page-heading p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(360px,1.55fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
h2{margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card h2:not(:first-child){margin-top:22px}
.dim,.muted{color:var(--muted)}
.form{display:grid;gap:10px;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.row>button,.row>.fit{flex:0 0 auto}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;
  transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#94a3b8}
input:focus,select:focus,textarea:focus{border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:inherit;font-weight:600;color:#fff;background:var(--primary);border:1px solid transparent;
  border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;
  transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
button:hover,.btn:hover{background:var(--primary-hover);text-decoration:none}
button:focus-visible,.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
button:disabled{opacity:.55;cursor:not-allowed}
button.ghost,.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--line)}
button.ghost:hover,.btn-secondary:hover{background:var(--surface-2);border-color:#cbd5e1}
button.small,.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px}
button.danger{background:var(--surface);color:var(--danger);border-color:#fecaca}
button.danger:hover{background:var(--danger-soft)}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{padding-top:0;border-top:0}
.issue-title{font-weight:600;line-height:1.4}
.issue-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:13px}
.issue-meta a{font-weight:500}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:2px 9px}
.tag.pr{color:var(--warning);background:var(--warning-soft);border-color:var(--warning-soft)}
.tag input{margin:0;width:auto}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.out{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface-2)}
.out pre{white-space:pre-wrap;word-break:break-word;margin:12px 0 0;padding:14px;
  max-height:520px;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;font:13px/1.6 var(--code);color:var(--text)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:4px 10px}
.status.pending{color:var(--warning);background:var(--warning-soft)}
.status.bad{color:var(--danger);background:var(--danger-soft)}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:420px;text-align:center;padding:36px}
.login-card .brand-mark{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;font-size:15px}
.login-card h1{margin:0 0 8px;font-size:24px;letter-spacing:-.02em}
.login-card p{margin:0 0 20px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;
  max-width:min(560px,90vw);padding:11px 16px;border-radius:10px;background:#0f172a;color:#fff;
  font-size:13px;box-shadow:0 12px 32px rgba(15,23,42,.22)}
[hidden]{display:none!important}
@media (max-width:820px){
  header{padding:0 16px}
  .header-right{gap:10px}
  .mode .mode-text{display:none}
  main{padding:24px 16px 48px}
  .grid{grid-template-columns:1fr}
  .card.wide{grid-column:auto}
}
</style></head>
<body data-mode="contributor">
<header id="top" hidden>
  <div class="brand"><span class="brand-mark">IS</span><span>Issue Solver</span></div>
  <div class="header-right">
    <label class="mode" id="modeWrap" hidden><span class="mode-text">Maintainer mode</span><input type="checkbox" id="mode"><span class="slider"></span></label>
    <span id="who" class="user-chip"></span>
    <button class="btn-secondary small" id="logout">Sign out</button>
  </div>
</header>

<div id="login" hidden><div class="card login-card">
  <div class="brand-mark">IS</div>
  <h1>Issue Solver</h1>
  <p id="loginMsg">Access is invite-only. Sign in with the GitHub account the administrator added.</p>
  <a class="btn" href="/auth/login">Sign in with GitHub</a>
</div></div>

<main id="app" hidden>
  <div class="page-heading">
    <h1>Dashboard</h1>
    <p>Manage model keys, pick up issues, and open pull requests for review.</p>
  </div>
  <div class="grid">
    <section class="card"><h2>AI model keys</h2><div id="keys"></div>
      <div class="form">
        <select id="provider"></select>
        <input id="label" placeholder="Label (e.g. My OpenRouter key)">
        <input id="baseUrl" placeholder="Base URL (https://…)" hidden>
        <input id="model" placeholder="Model">
        <input id="apiKey" type="password" placeholder="API key" autocomplete="off">
        <button id="saveKey">Validate &amp; save</button>
      </div></section>
    <section class="card" id="work"></section>
    <section class="card wide" id="adminCard" hidden><h2>Admin: users</h2>
      <div class="row"><input id="newUser" placeholder="GitHub username"><select id="newRole"><option>contributor</option><option>maintainer</option><option>admin</option></select><button id="addUser">Add user</button></div>
      <div id="users"></div></section>
    <section class="card wide" id="auditCard" hidden><h2>Admin: audit log</h2><div id="audit"></div></section>
  </div>
</main>
<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body></html>
